<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeHub - Discuss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
  <div class="header-left">
    <h1><a href="index.html">CodeHub</a></h1>
    <nav>
      <a href="problem.html">Problems</a>
      <a href="index.html">Study Groups</a>
      <a href="contests.html">Contests</a>
      <a href="discuss.html" class="active">Discuss</a>
      <a href="explore.html">Explore</a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
  <div class="header-right">
    <a href="login.html" id="auth-button" class="btn-auth"
    >Log In / Sign Up</a
    >
    <button id="theme-toggle-btn" class="theme-btn">🌙</button>
  </div>
</header>

<main class="container">
  <div class="groups-header">
    <h2>Discussion Forum</h2>
    <button id="show-create-post-btn">Create New Post</button>
  </div>

  <form id="create-post-form" class="hidden">
    <h3>Create a New Post</h3>
    <input type="text" id="post-title" placeholder="Post Title" required />
    <textarea
            id="post-content"
            placeholder="What's on your mind? (Full editor not implemented)"
            rows="5"
    ></textarea>
    <input type="text" id="post-tags" placeholder="Tags (comma-separated)" />
    <div class="form-actions">
      <button type="submit">Save Post</button>
      <button type="button" id="cancel-create-post-btn">Cancel</button>
    </div>
  </form>

  <div class="discuss-list" id="discuss-list-container">
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
