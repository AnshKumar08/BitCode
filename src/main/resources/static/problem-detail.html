<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeHub - Problem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .main-container {
            padding: 2rem 1rem;
            max-width: none;
            background: var(--bg-color);
            min-height: calc(100vh - 80px);
        }

        .split-view {
            display: flex;
            gap: 0;
            height: calc(100vh - 120px);
            max-width: 100vw;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 25px 80px -12px rgba(0,0,0,0.4);
        }

        /* LEFT PANEL: Problem (Dark) */
        .problem-panel {
            flex: 0 0 42%;
            background: linear-gradient(145deg, #1e1e1e, #0f0f0f);
            border-right: 2px solid #333;
            padding: 2.5rem;
            overflow-y: auto;
            position: relative;
        }

        .problem-panel::-webkit-scrollbar {
            width: 6px;
        }
        .problem-panel::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .problem-panel::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .problem-panel::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #444, transparent);
        }

        .problem-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #333;
        }

        .problem-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #e2e8f0;
            line-height: 1.2;
            flex: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .difficulty-tag {
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .difficulty-easy {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
        }
        .difficulty-medium {
            background: rgba(251, 191, 36, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.25);
        }
        .difficulty-hard {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }

        .problem-content {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #cbd5e1;
        }

        .problem-content h2, .problem-content h3 {
            color: #f1f5f9;
            margin: 2.5rem 0 1.25rem 0;
            font-weight: 700;
        }

        .problem-content h2 { font-size: 1.5rem; }
        .problem-content h3 { font-size: 1.3rem; }

        .problem-content p {
            margin-bottom: 1.75rem;
            opacity: 0.9;
        }

        .problem-content strong {
            color: #f8fafc;
        }

        .problem-content code {
            background: rgba(30, 41, 59, 0.8);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            color: #60a5fa;
            border: 1px solid #475569;
        }

        .problem-content pre {
            background: #0f111a;
            padding: 2.25rem;
            border-radius: 20px;
            border-left: 5px solid #3b82f6;
            overflow-x: auto;
            margin: 2.5rem 0;
            font-size: 0.98rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid #1e293b;
        }

        /* RIGHT PANEL: Editor (Pure Dark) */
        .editor-panel {
            flex: 1;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            border-radius: 0 24px 24px 0;
            overflow: hidden;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0f0f0f;
        }

        .editor-toolbar {
            padding: 1.75rem 3rem;
            background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
        }

        .language-group {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            color: #94a3b8;
            font-weight: 600;
            font-size: 1rem;
        }

        #language-select {
            padding: 1rem 1.75rem;
            border: 2px solid #334155;
            border-radius: 16px;
            background: #1e1e1e;
            color: #f1f5f9;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 140px;
            transition: all 0.3s ease;
        }

        #language-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background: #252525;
        }

        #language-select:hover {
            border-color: #475569;
            background: #252525;
        }

        .action-buttons {
            display: flex;
            gap: 1.75rem;
        }

        .btn {
            padding: 1.125rem 2.75rem;
            border: none;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(20px);
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn:hover::before { transform: translateX(100%); }

        .btn-run {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: 2px solid rgba(34, 197, 94, 0.3);
        }
        .btn-run:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 50px rgba(5, 150, 105, 0.5);
        }

        .btn-submit {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
            color: white;
            border: 2px solid rgba(59, 130, 246, 0.4);
        }
        .btn-submit:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 50px rgba(29, 78, 216, 0.5);
        }

        #code-editor {
            flex: 1;
            font-size: 15px !important;
            font-family: 'Fira Code', 'JetBrains Mono', monospace !important;
            background: #0f0f0f !important;
        }

        .results-section {
            padding: 3rem 2.5rem;
            border-top: 1px solid #333;
            background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 1.1rem;
            text-align: center;
        }

        .verdict-container {
            text-align: center;
            padding: 3rem;
        }

        .verdict-badge {
            font-size: 2.5rem;
            font-weight: 900;
            padding: 2rem 3rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
        }

        .verdict-accepted {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(16, 163, 74, 0.2));
            color: #22c55e;
            border: 3px solid rgba(34, 197, 94, 0.6);
        }

        .verdict-wrong {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(220, 38, 38, 0.2));
            color: #ef4444;
            border: 3px solid rgba(239, 68, 68, 0.6);
        }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .output-panel {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 2.25rem;
            border: 1px solid #333;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .output-header {
            font-weight: 800;
            margin-bottom: 1.5rem;
            font-size: 1.15rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #f1f5f9;
        }

        .your-output { border-bottom-color: #3b82f6; }
        .expected-output { border-bottom-color: #22c55e; }
        .error-output { border-bottom-color: #ef4444; }

        .output-content {
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 120px;
            color: #e2e8f0;
            background: #111;
            padding: 1.75rem;
            border-radius: 16px;
            border: 1px solid #2d2d2d;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .split-view { flex-direction: column; height: auto; }
            .problem-panel { max-width: none; flex: none; }
        }

        @media (max-width: 768px) {
            .split-view { border-radius: 16px; }
            .action-buttons { flex-direction: column; gap: 1rem; }
            .btn { width: 100%; justify-content: center; }
            .outputs-grid { grid-template-columns: 1fr; }
            .problem-panel { padding: 1.5rem; }
        }
    </style>



</head>
<body>
<header>
    <div class="header-left">
        <h1><a href="index.html">CodeHub</a></h1>
        <nav>
            <a href="problem.html" class="active">Problems</a>
            <a href="index.html">Study Groups</a>
            <a href="contests.html">Contests</a>
            <a href="discuss.html">Discuss</a>
            <a href="explore.html">Explore</a>
            <a href="profile.html">Profile</a>
        </nav>
    </div>
    <div class="header-right">
        <a href="login.html" id="auth-button" class="btn-auth">Log In / Sign Up</a>
        <button id="theme-toggle-btn" class="theme-btn">🌙</button>
    </div>
</header>

<main class="main-container">
    <div class="split-view">
        <!-- LEFT: Problem Description -->
        <div class="problem-panel">
            <div class="problem-header">
                <h1 id="problem-title" class="problem-title">Loading...</h1>
                <span id="problem-difficulty-badge" class="difficulty-tag">--</span>
            </div>
            <div id="problem-body" class="problem-content">
                <p>Loading problem...</p>
            </div>
        </div>

        <!-- RIGHT: Code Editor + Results -->
        <div class="editor-panel">
            <!-- Editor -->
            <div class="editor-section">
                <div class="editor-toolbar">
                    <div class="toolbar-left">
                        <label>Language:</label>
                        <select id="language-select">
                            <option value="java">Java</option>
                            <option value="python">Python</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                    <div class="action-buttons">
                        <button id="run-btn" class="btn btn-run">
                            <span>▶</span> Run
                        </button>
                        <button id="submit-btn" class="btn btn-submit">
                            Submit
                        </button>
                    </div>
                </div>
                <div id="code-editor"></div>
            </div>

            <!-- Results -->
            <div id="output-console" class="results-section">
                Click "Run" to test your code.
            </div>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/theme-monokai.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/theme-chrome.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/mode-java.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/mode-python.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.33.0/mode-c_cpp.js"></script>

<script src="js/app.js"></script>
</body>
</html>
