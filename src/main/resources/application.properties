spring.application.name=leetcodeclone

# Server Port
server.port=8080

# H2 Database Configuration (File-based for persistence) - FIXED
spring.datasource.url=jdbc:h2:file:./data/bitcodedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Judge0 API Configuration
judge0.api.url=https://judge0-ce.p.rapidapi.com/submissions
judge0.api.host=judge0-ce.p.rapidapi.com
judge0.api.key=ecb6726926920msh3e0f5ce04d7216ap1e5cabjsnb84935b3b0e5

# Jackson
spring.jackson.stream-write-constraints.max-nesting-depth=2000
spring.jackson.serialization.fail-on-self-references=false
spring.jackson.default-property-inclusion=non_null

# JWT
jwt.secret=your-super-secret-key-min-32-chars-long!@#$%^&*()_+-=ktgfhjdfhdhgdgcbcxbgxgfcnhghjgmh,jg,kghjgjvjgg
jwt.expiration=604800000

# Disable auto basic auth
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
